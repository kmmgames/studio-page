<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Site is under construction</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #fdfdfd;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
        }

        .impressum-link {
            margin-top: 100vh; /* Macht den Button erst nach Scroll sichtbar */
            padding: 20px;
        }

        .impressum-link a {
            font-size: 20px;
            text-decoration: none;
            background-color: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .impressum-link a:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <div class="hero">
        Site is under construction
    </div>

    <div class="impressum-link">
        <a href="impressum.html">→ Zum Impressum</a>
    </div>
</body>
</html>
